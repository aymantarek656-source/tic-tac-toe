<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة Tic-Tac-Toe مع الذكاء الاصطناعي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 10px;
            color: #00d2ff;
        }
        .status {
            font-size: 1.2rem;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            background: #3a3a5c;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .cell {
            background: #2a2a40;
            border: none;
            border-radius: 8px;
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, transform 0.1s;
        }
        .cell:hover {
            background: #4a4a7c;
            transform: scale(1.05);
        }
        .cell.x { color: #ff4757; }
        .cell.o { color: #2ed573; }
        .restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            background: #00d2ff;
            border: none;
            border-radius: 8px;
            color: #1e1e2f;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .restart-btn:hover {
            background: #0099cc;
            color: #fff;
        }
    </style>
</head>
<body>

    <h1>لعبة إكس أو (Tic-Tac-Toe)</h1>
    <div class="status" id="status">دور اللاعب (X)</div>

    <div class="board" id="board">
        <button class="cell" onclick="makeMove(0)"></button>
        <button class="cell" onclick="makeMove(1)"></button>
        <button class="cell" onclick="makeMove(2)"></button>
        <button class="cell" onclick="makeMove(3)"></button>
        <button class="cell" onclick="makeMove(4)"></button>
        <button class="cell" onclick="makeMove(5)"></button>
        <button class="cell" onclick="makeMove(6)"></button>
        <button class="cell" onclick="makeMove(7)"></button>
        <button class="cell" onclick="makeMove(8)"></button>
    </div>

    <button class="restart-btn" onclick="restartGame()">إعادة اللعبة</button>

    <script>
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X'; // X هو الإنسان، O هو الذكاء الاصطناعي
        let isGameActive = true;

        const statusDisplay = document.getElementById('status');
        const cells = document.querySelectorAll('.cell');

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function makeMove(index) {
            if (board[index] === '' && isGameActive && currentPlayer === 'X') {
                board[index] = 'X';
                cells[index].innerText = 'X';
                cells[index].classList.add('x');

                if (checkWin('X')) {
                    statusDisplay.innerText = 'مبروك! لقد فزت على الذكاء الاصطناعي 🎉';
                    isGameActive = false;
                    return;
                }

                if (board.every(cell => cell !== '')) {
                    statusDisplay.innerText = 'تعادل! 🤝';
                    isGameActive = false;
                    return;
                }

                currentPlayer = 'O';
                statusDisplay.innerText = 'دور الذكاء الاصطناعي (O)...';
                setTimeout(aiMove, 500);
            }
        }

        function aiMove() {
            if (!isGameActive) return;
            
            let bestScore = -Infinity;
            let move;
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'O';
                    let score = minimax(board, 0, false);
                    board[i] = '';
                    if (score > bestScore) {
                        bestScore = score;
                        move = i;
                    }
                }
            }

            board[move] = 'O';
            cells[move].innerText = 'O';
            cells[move].classList.add('o');

            if (checkWin('O')) {
                statusDisplay.innerText = 'للأسف، فاز الذكاء الاصطناعي 🤖';
                isGameActive = false;
                return;
            }

            if (board.every(cell => cell !== '')) {
                statusDisplay.innerText = 'تعادل! 🤝';
                isGameActive = false;
                return;
            }

            currentPlayer = 'X';
            statusDisplay.innerText = 'دورك للعب (X)';
        }

        function minimax(newBoard, depth, isMaximizing) {
            if (checkWinForBoard(newBoard, 'O')) return 10 - depth;
            if (checkWinForBoard(newBoard, 'X')) return depth - 10;
            if (newBoard.every(cell => cell !== '')) return 0;

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (newBoard[i] === '') {
                        newBoard[i] = 'O';
                        let evaluation = minimax(newBoard, depth + 1, false);
                        newBoard[i] = '';
                        maxEval = Math.max(maxEval, evaluation);
                    }
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (newBoard[i] === '') {
                        newBoard[i] = 'X';
                        let evaluation = minimax(newBoard, depth + 1, true);
                        newBoard[i] = '';
                        minEval = Math.min(minEval, evaluation);
                    }
                }
                return minEval;
            }
        }

        function checkWin(player) {
            return winningConditions.some(condition => {
                return condition.every(index => board[index] === player);
            });
        }

        function checkWinForBoard(b, player) {
            return winningConditions.some(condition => {
                return condition.every(index => b[index] === player);
            });
        }

        function restartGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            isGameActive = true;
            currentPlayer = 'X';
            statusDisplay.innerText = 'دورك للعب (X)';
            cells.forEach(cell => {
                cell.innerText = '';
                cell.classList.remove('x', 'o');
            });
        }
    </script>
</body>
</html>
